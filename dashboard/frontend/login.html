<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPS-SECURE — Accès Restreint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
  <style>
    :root {
      --bg:#070a09; --bg2:#0b0f0d;
      --card:rgba(15,21,18,0.88);
      --teal:#00ff88; --teal-l:#33ffaa; --teal-d:#00cc6a;
      --rose:#ff4d6d;
      --text:#e8f0ed; --muted:#4a6b58;
      --border:rgba(0,255,136,0.09);
      --glow:rgba(0,255,136,0.22);
      --r:18px; --r-sm:10px;
    }

    /* ── KEYFRAMES ──────────────────────────────────────────────────── */
    @keyframes spin        { to{transform:rotate(360deg)} }
    @keyframes blink       { 0%,100%{opacity:1}50%{opacity:0} }
    @keyframes pulseGreen  { 0%,100%{box-shadow:0 0 6px rgba(34,197,94,.5)}50%{box-shadow:0 0 18px rgba(34,197,94,.95)} }
    @keyframes float       { 0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)} }
    @keyframes scanMove    { from{transform:translateY(-100%)}to{transform:translateY(100vh)} }
    @keyframes radarSpin   { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
    @keyframes haloBreath  { 0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.04)} }
    @keyframes cardIn      { from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes logoIn      { from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)} }
    @keyframes shimmerBtn  { 0%{background-position:200% center}100%{background-position:-200% center} }
    @keyframes shake       { 0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)} }
    @keyframes successFlash{ 0%{opacity:.2}100%{opacity:0} }
    @keyframes cornerIn    { from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)} }
    @keyframes glitch-clip1 { 0%,100%{clip-path:inset(0 0 95% 0)} 50%{clip-path:inset(30% 0 50% 0)} }
    @keyframes glitch-clip2 { 0%,100%{clip-path:inset(60% 0 20% 0)} 50%{clip-path:inset(80% 0 5% 0)} }
    @keyframes glitch-shift1 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-4px)} }
    @keyframes glitch-shift2 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
    @keyframes borderGlow  { 0%,100%{box-shadow:0 0 0 1px var(--border),0 8px 32px rgba(0,0,0,.6),0 32px 64px rgba(0,0,0,.35)} 50%{box-shadow:0 0 0 1px rgba(0,255,136,0.22),0 8px 32px rgba(0,0,0,.6),0 0 48px rgba(0,255,136,0.08),0 32px 64px rgba(0,0,0,.35)} }

    /* ── BASE ────────────────────────────────────────────────────────── */
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-font-smoothing:antialiased; }
    body {
      background:var(--bg);
      font-family:'JetBrains Mono',monospace;
      color:var(--text);
      min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
      perspective:1200px;
    }

    /* ── CANVAS ─────────────────────────────────────────────────────── */
    #bg-canvas { position:fixed;inset:0;z-index:0;pointer-events:none; }

    /* ── SCAN LINE ──────────────────────────────────────────────────── */
    .scanline { position:fixed;left:0;right:0;height:2px;background:linear-gradient(transparent,rgba(0,255,136,.06),transparent);animation:scanMove 5s linear infinite;pointer-events:none;z-index:1; }

    /* ── GRID ────────────────────────────────────────────────────────── */
    .grid-overlay { position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,255,136,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.022) 1px,transparent 1px);background-size:44px 44px; }

    /* ── HALOS ───────────────────────────────────────────────────────── */
    .halo { position:fixed;border-radius:50%;pointer-events:none;z-index:0; }
    .halo-tl { top:-200px;left:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(0,255,136,.055) 0%,transparent 65%);animation:haloBreath 7s ease infinite; }
    .halo-br { bottom:-180px;right:-180px;width:550px;height:550px;background:radial-gradient(circle,rgba(0,255,136,.04) 0%,transparent 65%);animation:haloBreath 9s ease infinite 2s; }

    /* ── LANG TOGGLE (fixed top-right) ───────────────────────────────── */
    .btn-lang-login {
      position:fixed;top:16px;right:16px;z-index:20;
      padding:5px 11px;
      border:1px solid rgba(0,255,136,0.18);border-radius:6px;
      background:rgba(0,255,136,0.05);color:var(--teal);
      cursor:pointer;font-size:11px;font-weight:700;
      font-family:'JetBrains Mono',monospace;letter-spacing:.5px;
      transition:background .15s,box-shadow .15s,transform .15s;
    }
    .btn-lang-login:hover { background:rgba(0,255,136,0.1);box-shadow:0 0 10px var(--glow);transform:scale(1.06); }

    /* ── WRAP ────────────────────────────────────────────────────────── */
    .login-wrap { width:100%;max-width:420px;padding:20px;position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:28px; }

    /* ── LOGO ────────────────────────────────────────────────────────── */
    .logo-area { display:flex;flex-direction:column;align-items:center;gap:14px;animation:logoIn .7s cubic-bezier(.4,0,.2,1) both; }
    .shield-ring-wrap { position:relative;width:78px;height:78px;display:flex;align-items:center;justify-content:center; }
    .shield-radar { position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,rgba(0,255,136,.22) 0deg,transparent 70deg,transparent 360deg);animation:radarSpin 3s linear infinite; }
    .shield-ring { position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(0,255,136,.18);animation:haloBreath 2.5s ease infinite; }
    .shield-ring-outer { position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(0,255,136,.08);animation:haloBreath 2.5s ease infinite .6s; }
    .shield-icon-bg { width:64px;height:64px;border-radius:50%;background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);box-shadow:0 0 24px rgba(0,255,136,.15),inset 0 0 14px rgba(0,255,136,.05);display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;z-index:1;animation:float 4s ease infinite; }

    .brand-tag { font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:var(--teal);letter-spacing:2px;text-transform:uppercase;opacity:.65; }
    .brand-name-wrap { position:relative;display:inline-block; }

    .brand-name {
      font-family:'Orbitron',sans-serif;font-size:22px;font-weight:800;
      letter-spacing:3px;color:var(--text);line-height:1;text-align:center;
      position:relative;display:inline-block;user-select:none;
    }
    .brand-name span { color:var(--teal);text-shadow:0 0 18px rgba(0,255,136,.6); }
    .brand-name::before,
    .brand-name::after {
      content:attr(data-text);
      position:absolute;top:0;left:0;width:100%;
      font-family:'Orbitron',sans-serif;font-size:22px;font-weight:800;letter-spacing:3px;
      opacity:0;pointer-events:none;
    }
    .brand-name.glitching::before {
      color:var(--rose);text-shadow:2px 0 var(--rose);
      opacity:.7;
      animation:glitch-clip1 .15s steps(1) infinite,glitch-shift1 .15s steps(1) infinite;
    }
    .brand-name.glitching::after {
      color:var(--teal);text-shadow:-2px 0 var(--teal);
      opacity:.7;
      animation:glitch-clip2 .15s steps(1) infinite,glitch-shift2 .15s steps(1) infinite;
    }
    .brand-sub { font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;text-align:center; }

    /* ── CARD ────────────────────────────────────────────────────────── */
    .card {
      width:100%;
      background:var(--card);
      backdrop-filter:blur(24px) saturate(180%);
      border-radius:var(--r);padding:36px 34px;
      border:1px solid var(--border);
      box-shadow:0 0 0 1px var(--border),0 8px 32px rgba(0,0,0,.6),0 32px 64px rgba(0,0,0,.35);
      position:relative;overflow:hidden;
      animation:cardIn .65s cubic-bezier(.4,0,.2,1) .15s both, borderGlow 4s ease infinite 1s;
      transform-style:preserve-3d;
      transition:box-shadow .2s;
      will-change:transform;
    }
    .card::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--teal) 40%,var(--teal-l) 60%,transparent 100%);box-shadow:0 0 20px rgba(0,255,136,.5); }
    .card::after { content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(0,255,136,.028) 0%,transparent 100%);border-radius:var(--r); }

    .card-sheen {
      position:absolute;inset:0;border-radius:var(--r);pointer-events:none;z-index:0;
      background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04) 0%, transparent 60%);
      opacity:0;transition:opacity .3s;
    }
    .card:hover .card-sheen { opacity:1; }

    .card .corner { position:absolute;width:16px;height:16px;border-color:rgba(0,255,136,.35);border-style:solid; }
    .card .corner-tl { top:12px;left:12px;border-width:1.5px 0 0 1.5px;animation:cornerIn .5s .3s both; }
    .card .corner-tr { top:12px;right:12px;border-width:1.5px 1.5px 0 0;animation:cornerIn .5s .35s both; }
    .card .corner-bl { bottom:12px;left:12px;border-width:0 0 1.5px 1.5px;animation:cornerIn .5s .4s both; }
    .card .corner-br { bottom:12px;right:12px;border-width:0 1.5px 1.5px 0;animation:cornerIn .5s .45s both; }
    .card-scanlines { position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:var(--r);background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,136,.012) 3px,rgba(0,255,136,.012) 4px); }
    .card-inner { position:relative;z-index:1; }

    .card-title { font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text);margin-bottom:5px; }
    .card-sub { font-size:11px;color:var(--muted);margin-bottom:30px;font-family:'JetBrains Mono',monospace;line-height:1.5; }
    .card-sub::after { content:'_';color:var(--teal);animation:blink 1s step-end infinite;margin-left:2px; }

    /* ── FIELDS ──────────────────────────────────────────────────────── */
    .field { margin-bottom:20px;position:relative; }
    .field label { display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;font-family:'Orbitron',sans-serif; }
    .field label i { font-size:11px;color:var(--teal); }
    .field input { width:100%;padding:13px 16px;background:rgba(0,255,136,.025);border:1px solid rgba(0,255,136,.1);border-radius:var(--r-sm);font-size:13px;font-weight:500;font-family:'JetBrains Mono',monospace;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s,background .2s; }
    .field input:focus { border-color:rgba(0,255,136,.4);background:rgba(0,255,136,.04);box-shadow:0 0 0 3px rgba(0,255,136,.08),0 0 16px rgba(0,255,136,.08); }
    .field input::placeholder { color:var(--muted);opacity:.5; }
    .field input[type="password"] { font-family:'DM Mono',monospace;letter-spacing:3px;font-size:16px; }
    .field-underline { position:absolute;bottom:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-l));border-radius:0 0 var(--r-sm) var(--r-sm);transition:width .3s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(0,255,136,.4); }
    .field input:focus ~ .field-underline { width:100%; }

    /* ── STATUS ROW ─────────────────────────────────────────────────── */
    .status-row { display:flex;align-items:center;gap:8px;margin-bottom:22px;padding:8px 12px;background:rgba(0,255,136,.03);border:1px solid rgba(0,255,136,.08);border-radius:8px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.7);animation:pulseGreen 2s infinite; }
    .status-text { font-size:10px;color:var(--muted);font-family:'DM Mono',monospace; }
    .status-text b { color:var(--teal);font-weight:600; }
    .status-uptime { margin-left:auto;font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;opacity:.6; }

    /* ── BUTTON ─────────────────────────────────────────────────────── */
    .btn-login {
      width:100%;padding:14px;
      background:linear-gradient(90deg,var(--teal-d) 0%,var(--teal) 40%,var(--teal-l) 60%,var(--teal-d) 100%);
      background-size:200% auto;
      color:#070a09;border:none;border-radius:var(--r-sm);
      font-size:12px;font-weight:800;font-family:'Orbitron',sans-serif;
      letter-spacing:1.5px;text-transform:uppercase;
      cursor:pointer;
      box-shadow:0 0 24px rgba(0,255,136,.35),0 4px 12px rgba(0,0,0,.4);
      transition:transform .18s,box-shadow .18s;
      margin-top:8px;
      animation:shimmerBtn 3s linear infinite;
      position:relative;overflow:hidden;
    }
    .btn-login::before { content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.15) 50%,transparent 100%);transform:skewX(-20deg) translateX(-120%);transition:transform .55s; }
    .btn-login:hover { transform:translateY(-2px);box-shadow:0 0 40px rgba(0,255,136,.55),0 8px 20px rgba(0,0,0,.4); }
    .btn-login:hover::before { transform:skewX(-20deg) translateX(240%); }
    .btn-login:active { transform:translateY(0); }
    .btn-login:disabled { opacity:.5;pointer-events:none;animation:none; }

    /* ── ERROR ──────────────────────────────────────────────────────── */
    .error-box { display:none;margin-top:16px;padding:11px 14px;background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.22);border-radius:var(--r-sm);font-size:11px;font-weight:600;color:#ff7090;text-align:center;font-family:'JetBrains Mono',monospace; }
    .error-box.visible { display:block; }
    .error-box.shake { animation:shake .4s ease; }

    /* ── SUCCESS FLASH ──────────────────────────────────────────────── */
    .success-flash { display:none;position:fixed;inset:0;z-index:999;background:var(--teal);pointer-events:none; }
    .success-flash.go { display:block;animation:successFlash .55s ease forwards; }

    /* ── FOOTER ─────────────────────────────────────────────────────── */
    .footer { display:flex;align-items:center;justify-content:center;gap:10px;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.5px;animation:cardIn .5s .4s both; }
    .footer::before { content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal);animation:pulseGreen 2s infinite; }

    .spin { display:inline-block;animation:spin .7s linear infinite; }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:rgba(0,255,136,.15);border-radius:10px; }
  </style>
</head>
<body>

<div class="scanline"></div>
<div class="grid-overlay"></div>
<div class="halo halo-tl"></div>
<div class="halo halo-br"></div>
<canvas id="bg-canvas"></canvas>
<div class="success-flash" id="success-flash"></div>

<!-- Lang toggle — fixed top-right -->
<button id="btn-lang-login" class="btn-lang-login"
        onclick="applyLang(currentLang === 'fr' ? 'en' : 'fr')"
        title="Switch language">🇫🇷 FR</button>

<div class="login-wrap">

  <div class="logo-area">
    <div class="shield-ring-wrap">
      <div class="shield-radar"></div>
      <div class="shield-ring-outer"></div>
      <div class="shield-ring"></div>
      <div class="shield-icon-bg">🛡️</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <div class="brand-tag">▲ Security Operations Center</div>
      <div class="brand-name-wrap">
        <div class="brand-name" id="brand-name" data-text="[ VPS-SECURE ]">[ <span>VPS-SECURE</span> ]</div>
      </div>
      <div class="brand-sub" data-i18n="brand_sub">Cockpit de monitoring sécurisé</div>
    </div>
  </div>

  <div class="card" id="login-card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="card-scanlines"></div>
    <div class="card-sheen" id="card-sheen"></div>

    <div class="card-inner">
      <div class="status-row">
        <div class="status-dot"></div>
        <span class="status-text" data-i18n-html="status_active"><b>Système actif</b> · accès TLS chiffré</span>
        <span class="status-uptime" id="clock">——:——:——</span>
      </div>
      <div class="card-title" data-i18n="card_title">Authentification</div>
      <div class="card-sub" data-i18n="card_sub">Accès restreint — identifie-toi</div>

      <div class="field">
        <label><i class="ph-fill ph-user"></i><span data-i18n="label_username"> Identifiant</span></label>
        <input type="text" id="username" value="admin" autocomplete="username" spellcheck="false">
        <div class="field-underline"></div>
      </div>
      <div class="field">
        <label><i class="ph-fill ph-lock"></i><span data-i18n="label_password"> Mot de passe</span></label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••••••">
        <div class="field-underline"></div>
      </div>

      <button class="btn-login" id="btn-login" onclick="login()">
        <span id="btn-text" data-i18n="btn_login">Accéder au dashboard</span>
      </button>

      <div class="error-box" id="error-box">
        <i class="ph-fill ph-warning" style="margin-right:6px;"></i><span data-i18n="error_creds">Identifiants incorrects — réessaie.</span>
      </div>
    </div>
  </div>

  <div class="footer">vps-secure &nbsp;·&nbsp; v2.7.8 &nbsp;·&nbsp; <span data-i18n="footer_tls">connexion TLS</span></div>
</div>

<script>
'use strict';

if (sessionStorage.getItem('vps_auth')) { window.location.href = '/'; }
const $id = id => document.getElementById(id);

/* ══════════════════════════════════════════════════════════════════════
   i18n
   ══════════════════════════════════════════════════════════════════════ */
const TRANSLATIONS = {
  fr: {
    page_title:    'VPS-SECURE — Accès Restreint',
    brand_sub:     'Cockpit de monitoring sécurisé',
    status_active: '<b>Système actif</b> · accès TLS chiffré',
    card_title:    'Authentification',
    card_sub:      'Accès restreint — identifie-toi',
    label_username:' Identifiant',
    label_password:' Mot de passe',
    btn_login:     'Accéder au dashboard',
    error_creds:   'Identifiants incorrects — réessaie.',
    error_server:  'Serveur inaccessible — vérifie ta connexion.',
    js_checking:   '↻ Vérification…',
    js_granted:    '✅ Accès autorisé',
    footer_tls:    'connexion TLS',
  },
  en: {
    page_title:    'VPS-SECURE — Restricted Access',
    brand_sub:     'Secure monitoring cockpit',
    status_active: '<b>System active</b> · TLS encrypted access',
    card_title:    'Authentication',
    card_sub:      'Restricted access — identify yourself',
    label_username:' Username',
    label_password:' Password',
    btn_login:     'Access dashboard',
    error_creds:   'Wrong credentials — try again.',
    error_server:  'Server unreachable — check your connection.',
    js_checking:   '↻ Checking…',
    js_granted:    '✅ Access granted',
    footer_tls:    'TLS connection',
  }
};

let currentLang = 'fr';
const t = key => (TRANSLATIONS[currentLang] || TRANSLATIONS.fr)[key] ?? key;

function applyLang(lang) {
  if (!TRANSLATIONS[lang]) return;
  currentLang = lang;
  const dict = TRANSLATIONS[lang];

  /* textContent */
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (dict[key] !== undefined) el.textContent = dict[key];
  });

  /* innerHTML */
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.dataset.i18nHtml;
    if (dict[key] !== undefined) el.innerHTML = dict[key];
  });

  /* <title> */
  document.title = dict.page_title;
  document.documentElement.lang = lang === 'fr' ? 'fr' : 'en';
  localStorage.setItem('vpssecure_lang', lang);

  /* Bouton toggle */
  const btn = $id('btn-lang-login');
  if (btn) btn.textContent = lang === 'fr' ? '🇫🇷 FR' : '🇺🇸 EN';
}

/* Init — lit le même localStorage que le dashboard */
(function() {
  const saved = localStorage.getItem('vpssecure_lang');
  applyLang(saved === 'en' ? 'en' : 'fr');
})();

/* ── Clock ─────────────────────────────────────────────────────────── */
function updateClock() {
  $id('clock').textContent = new Date().toLocaleTimeString(currentLang === 'fr' ? 'fr-FR' : 'en-US');
}
updateClock(); setInterval(updateClock, 1000);

/* ── Constellation canvas ──────────────────────────────────────────── */
(function() {
  const canvas = $id('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  const PARTICLE_COUNT = 70;
  const CONNECTION_DIST = 130;
  let particles = [];
  let mouse = { x: -9999, y: -9999 };

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.4 + 0.1,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.012 + Math.random() * 0.018,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    particles.forEach(p => {
      /* Mouse repulsion */
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 100) {
        p.vx += (dx / dist) * 0.08;
        p.vy += (dy / dist) * 0.08;
      }
      p.vx *= 0.995; p.vy *= 0.995;
      p.x += p.vx; p.y += p.vy;
      p.pulse += p.pulseSpeed;

      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    });

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < CONNECTION_DIST) {
          const opacity = (1 - dist / CONNECTION_DIST) * 0.22;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(0,255,136,${opacity})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }

    particles.forEach(p => {
      const pulse = 0.7 + 0.3 * Math.sin(p.pulse);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,255,136,${p.alpha * pulse})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
})();

/* ── 3D Parallax on card ───────────────────────────────────────────── */
(function() {
  const card = $id('login-card');
  const sheen = $id('card-sheen');
  if (!card) return;

  let targetRX = 0, targetRY = 0, currentRX = 0, currentRY = 0;
  let rafId = null;
  const MAX_ROT = 8;

  document.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    const dx = (e.clientX - cx) / (window.innerWidth  / 2);
    const dy = (e.clientY - cy) / (window.innerHeight / 2);
    targetRX = -dy * MAX_ROT;
    targetRY =  dx * MAX_ROT;
    const px = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
    const py = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
    sheen.style.background = `radial-gradient(circle at ${px}% ${py}%, rgba(255,255,255,0.055) 0%, transparent 55%)`;
  });
  document.addEventListener('mouseleave', () => { targetRX = 0; targetRY = 0; });

  function animate() {
    currentRX += (targetRX - currentRX) * 0.1;
    currentRY += (targetRY - currentRY) * 0.1;
    card.style.transform = `rotateX(${currentRX}deg) rotateY(${currentRY}deg)`;
    rafId = requestAnimationFrame(animate);
  }
  animate();
})();

/* ── Glitch effect on brand name ───────────────────────────────────── */
(function() {
  const el = $id('brand-name');
  if (!el) return;
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*[]{}|<>';
  const original = '[ VPS-SECURE ]';

  function glitch() {
    el.classList.add('glitching');
    let iter = 0;
    const interval = setInterval(() => {
      el.setAttribute('data-text',
        original.split('').map((ch, i) => {
          if (i < iter) return ch;
          if (ch === ' ' || ch === '[' || ch === ']') return ch;
          return CHARS[Math.floor(Math.random() * CHARS.length)];
        }).join('')
      );
      iter += 1.4;
      if (iter > original.length) {
        el.setAttribute('data-text', original);
        el.classList.remove('glitching');
        clearInterval(interval);
      }
    }, 28);
  }

  setInterval(glitch, 2000);
  el.addEventListener('mouseenter', glitch);
})();

/* ── Enter → login ─────────────────────────────────────────────────── */
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

/* ── Login ─────────────────────────────────────────────────────────── */
async function login() {
  const user = $id('username').value.trim();
  const pass = $id('password').value;
  const btn  = $id('btn-login');
  const txt  = $id('btn-text');
  const err  = $id('error-box');

  if (!user || !pass) { $id('password').focus(); return; }

  btn.disabled = true;
  txt.innerHTML = `<span class="spin" style="display:inline-block;margin-right:6px;">↻</span> ${t('js_checking')}`;
  err.classList.remove('visible', 'shake');

  const token = 'Basic ' + btoa(`${user}:${pass}`);

  try {
    const res = await fetch('/api/health', { cache:'no-store', headers:{'Authorization':token} });
    if (res.ok) {
      sessionStorage.setItem('vps_auth', token);
      txt.textContent = t('js_granted');
      btn.style.background = '#22c55e';
      btn.style.animation = 'none';
      $id('success-flash').classList.add('go');
      setTimeout(() => { window.location.href = '/'; }, 480);
    } else {
      err.querySelector('[data-i18n="error_creds"]').textContent = t('error_creds');
      err.classList.add('visible');
      void err.offsetWidth;
      err.classList.add('shake');
      $id('password').value = '';
      $id('password').focus();
      setTimeout(() => err.classList.remove('shake'), 420);
    }
  } catch {
    err.querySelector('[data-i18n="error_creds"]').textContent = t('error_server');
    err.classList.add('visible');
  } finally {
    if (!sessionStorage.getItem('vps_auth')) {
      btn.disabled = false;
      txt.textContent = t('btn_login');
    }
  }
}
</script>
